backend:
  image:
    repository: nikitadanilenko/londo
    tag: latest
    pullPolicy: Always
  port: 9000
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  javaOpts: "-Xmx768m -Xms256m"

frontend:
  image:
    repository: nikitadanilenko/londo-frontend
    tag: latest
    pullPolicy: Always
  port: 80
  replicaCount: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "100m"

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  database: londo
  username: londo
  storage:
    size: 1Gi

ingress:
  host: londo.danilenko.io
  clusterIssuer: letsencrypt-prod

config:
  jwtDurationSeconds: "86400"
  jwtPublicKey: ""
  mailerFrom: londo@mail.danilenko.io
  mailerPort: "587"
  mailerTls: "true"