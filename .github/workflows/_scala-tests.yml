name: Run Scala tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Prepare environment, and run Scala tests
    runs-on: ubuntu-latest
    permissions: {}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: londo_test
          POSTGRES_PASSWORD: 5WuVjFBUWYWasGBLpw7MtNvLL87Mn7RgH09wlsBH
          POSTGRES_PORT: 5432
          POSTGRES_USER: londo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'
      - name: Set up SBT
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6
      - name: Run tests
        run: sbt test