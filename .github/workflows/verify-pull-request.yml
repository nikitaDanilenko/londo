name: Verify pull request

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      back-end-paths-changed: ${{ steps.back-end.outputs.back-end-src }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: back-end
        with:
          filters: |
            back-end-src:
              - 'app/**'
              - 'test/**'
              - 'conf/**'
              - 'build.sbt'
              - 'project/**'
              - '.scalafmt.conf'

  back-end-test:
    needs: changes
    if: ${{ needs.changes.outputs.back-end-paths-changed == 'true' }}
    uses: ./.github/workflows/_scala-tests.yml

  combine-tests:
    needs:
      - back-end-test
    runs-on: ubuntu-latest
    if: always() && (needs.back-end-test.result == 'success' || needs.back-end-test.result == 'skipped')
    steps:
      - name: Finish test
        run: echo "All tests passed"