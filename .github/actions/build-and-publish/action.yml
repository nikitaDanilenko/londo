name: Build and publish Docker image

description: Builds and pushes a Docker image to Docker Hub

inputs:
  version-tag:
    description: 'Version tag for the Docker image'
    required: true
  image-name:
    description: 'Docker Hub image name (e.g. nikitadanilenko/londo)'
    required: true
  context:
    description: 'Docker build context path'
    required: true
  docker-hub-username:
    description: 'Docker Hub username'
    required: true
  docker-hub-token:
    description: 'Docker Hub access token'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to DockerHub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ inputs.docker-hub-username }}
        password: ${{ inputs.docker-hub-token }}
    - name: Set metadata
      id: metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image-name }}
        tags: |
          type=sha
          type=raw,value=latest
          type=semver,pattern={{version}},value=${{ inputs.version-tag }}
    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
